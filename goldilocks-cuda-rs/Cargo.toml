[package]
name = "goldilocks-cuda"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "CUDA-accelerated Goldilocks field arithmetic, extension fields, and Poseidon2 hashing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/goldilocks-cuda"
keywords = ["cryptography", "cuda", "goldilocks", "poseidon2", "zkp"]
categories = ["cryptography", "mathematics"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rand = "0.8"

[build-dependencies]
cc = "1.0"

[features]
default = ["monolith"]
monolith = []

[lib]
name = "goldilocks_cuda"
path = "src/lib.rs"
