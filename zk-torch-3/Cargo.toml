[package]
name = "zk-torch-3"
version = "0.1.0"
edition = "2021"

[dependencies]
goldilocks-cuda = { path = "../goldilocks-cuda-rs", default-features = false }
plonky2 = { version = "0.2.2", features = ["timing"] }
log = { version = "0.4", default-features = false }
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
bincode = "1.3"
once_cell = "1.15"
rand = "0.8"
rayon = "1.10"
num_cpus = "1.16"
ndarray = { version = "0.15", features = ["serde"] }
ndarray_einsum_beta = "0.7"

[features]
default = ["monolith"]
monolith = ["goldilocks-cuda/monolith"]
